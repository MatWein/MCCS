# Minecraft 1.21.1: everything that differs between Minecraft versions, read by all modules below this folder
# (settings.gradle hands these properties to them; see build-logic/ for what the modules do with them)
minecraft_version=1.21.1
java_version=21
# Minecraft is obfuscated: Fabric Loom with Mojang's names in dev and a remapped jar
fabric_loom_remap=true
# Fabric's access widener in common/src/main/resources (NeoForge uses its access transformer)
access_widener=mccs.accesswidener
# folders of shared/ compiled into the modules of this version: shared_mc into common (and so into every loader),
# shared_<loader> into that loader
shared_mc=mc/all,mc/1.20.1-1.21.1,mc/1.21.1-26.3,mixin/all,mixin/1.20.1-1.21.1
shared_fabric=fabric/all,fabric/1.20.1-1.21.1,fabric/1.21.1-26.3
shared_neoforge=neoforge/all

# NeoForge
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.266
neo_version_range=[21.1,)
loader_version_range=[4,)

# Fabric
fabric_loader_version=0.16.14
fabric_api_version=0.116.18+1.21.1
team_reborn_energy_version=4.1.0
