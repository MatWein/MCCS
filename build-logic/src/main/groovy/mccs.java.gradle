// Java settings of every Minecraft module (common and loaders): toolchain and bytecode level of the Minecraft
// version (java_version in versions/<version>/gradle.properties) and the core.
plugins {
    id 'java'
}

def javaVersion = (project.property('java_version') as String).toInteger()
java.toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
}

evaluationDependsOn(':core')
dependencies {
    // the game logic (the loader modules pack its classes into their jar)
    implementation project(':core')
}

/**
 * Adds the shared/ folders listed in the property (comma separated, e.g. shared_fabric=fabric/all) to this module's
 * sources: their java/ and, if present, resources/ folders.
 */
ext.addSharedFolders = { String propertyName ->
    def folders = (project.findProperty(propertyName) ?: '') as String
    folders.split(',').collect { it.trim() }.findAll { it }.each { folder ->
        def base = rootProject.file("shared/${folder}")
        if (!base.isDirectory()) throw new GradleException("${propertyName}: shared/${folder} does not exist")
        sourceSets.main.java.srcDir(new File(base, 'java'))
        if (new File(base, 'resources').isDirectory()) sourceSets.main.resources.srcDir(new File(base, 'resources'))
    }
}

/** A resource of this module's main source set: from its own folder or from one of the shared/ folders added to it. */
ext.mainResource = { String name ->
    def found = sourceSets.main.resources.srcDirs.collect { new File(it, name) }.find { it.isFile() }
    if (found == null) throw new GradleException("${name} is not among the resources of ${project.path}")
    found
}
