plugins {
    // only to compile against vanilla Minecraft 26.3 (unobfuscated, no mappings, no mod loader)
    id 'net.fabricmc.fabric-loom'
}

// Vanilla Minecraft 26.3 code shared by the NeoForge and Fabric modules. The loader modules compile these
// sources themselves (against their own Minecraft), so this module never ships as a jar of its own.

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation project(':core')
    // only for the annotation types Loom adds to Minecraft's classes; nothing of the loader is used here
    compileOnly "net.fabricmc:fabric-loader:0.20.1"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

// Minecraft code that compiles unchanged against every supported version (mc_core_common) is part of this module;
// the loader modules take it along with the rest of this source set
sourceSets.main {
    java.srcDir(rootProject.file('mc_core_common/src/main/java'))
    resources.srcDir(rootProject.file('mc_core_common/src/main/resources'))
}
