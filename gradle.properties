# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
mod_id=mccs
# The human-readable display name for the mod.
mod_name=MCCS - Crystal Staff
# The license of the mod (see LICENSE).
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=1.0.0
# The group ID for the mod; matches the base package used for the mod sources.
mod_group_id=de.mccs
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=Matthias Weinert
# The description of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_description=Two staffs as tall as the player, topped with an energy crystal (the high-energy one stores ten times as much): shield, cloak, lightning, energy balls, teleport, light and telekinesis, powered by Forge Energy or Team Reborn Energy. Developed entirely by AI.
# Links shown in the mod lists
mod_homepage=https://github.com/MatWein/MCCS
mod_sources=https://github.com/MatWein/MCCS
mod_issues=https://github.com/MatWein/MCCS/issues
